<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DupeSpotter 🛒 | Find Deals & Cheap Dupes</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    .cartoony-card {
      border: 3px solid #1e293b;
      box-shadow: 4px 4px 0px #1e293b;
    }
    .cartoony-card:hover {
      transform: translateY(-2px);
      box-shadow: 6px 6px 0px #1e293b;
    }
    .cartoony-button {
      border: 3px solid #1e293b;
      box-shadow: 3px 3px 0px #1e293b;
      transition: all 0.15s ease;
    }
    .cartoony-button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #1e293b;
    }
    .cartoony-input {
      border: 3px solid #1e293b;
      box-shadow: 4px 4px 0px #1e293b;
    }
  </style>
</head>
<body class="bg-pink-50 min-h-screen font-sans text-slate-900 pb-16">

  <!-- Header -->
  <header class="bg-white border-b-4 border-slate-900 py-4 mb-8 px-6">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="text-3xl">⭐</span>
        <h1 class="text-3xl font-black text-pink-600 tracking-tight">DupeSpotter</h1>
      </div>
      <div class="flex items-center gap-6 font-bold text-slate-700">
        <a href="#" class="hover:text-pink-600">Features</a>
        <a href="#" class="hover:text-pink-600">About</a>
        <a href="#" class="hover:text-pink-600">Blog</a>
        <a href="#" class="hover:text-pink-600">API</a>
        <a href="#" class="hover:text-pink-600">Contact</a>
      </div>
      <button class="cartoony-button bg-yellow-300 font-bold px-4 py-2 rounded-2xl flex items-center gap-2">
        <span>🎨 dbestguy productions</span>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4">
    <!-- Search Bar -->
    <form id="search-form" class="max-w-3xl mx-auto mb-10 flex flex-col sm:flex-row gap-3">
      <input 
        type="text" 
        id="search-input"
        placeholder="Search for hand chair, bleu de chanel, nike sneakers..." 
        class="cartoony-input flex-1 px-5 py-4 rounded-2xl text-lg font-bold bg-white focus:outline-none focus:ring-4 focus:ring-yellow-300"
        required
      />
      <button 
        type="submit" 
        class="cartoony-button bg-pink-500 hover:bg-pink-600 text-white font-black text-lg px-8 py-4 rounded-2xl flex items-center justify-center gap-2"
      >
        <span>Search Deals</span> 🔍
      </button>
    </form>

    <!-- Main Grid: Sidebar + Results -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
      
      <!-- Left Sidebar: Filter By -->
      <aside id="filter-container" class="bg-white p-6 rounded-3xl cartoony-card h-fit space-y-4">
        <h2 class="text-xl font-black text-slate-900 mb-4 flex items-center gap-2">
          ⚙️ Filter By
        </h2>

        <div class="space-y-3">
          <!-- ORIGINAL CATEGORY BUTTONS -->
          <button data-filter="all" class="w-full text-left cartoony-button bg-blue-500 text-white font-black px-4 py-3 rounded-2xl flex items-center gap-2 ring-4 ring-slate-900 scale-105">
            <span class="w-5 h-5 rounded-full bg-white border-2 border-slate-900 flex items-center justify-center text-xs text-slate-900">✓</span>
            All Deals
          </button>

          <button data-filter="low-to-high" class="w-full text-left cartoony-button bg-white hover:bg-amber-50 text-slate-900 font-black px-4 py-3 rounded-2xl flex items-center gap-2">
            <span class="w-5 h-5 rounded-full border-2 border-slate-900"></span>
            📉 Low to High
          </button>

          <button data-filter="high-to-low" class="w-full text-left cartoony-button bg-white hover:bg-amber-50 text-slate-900 font-black px-4 py-3 rounded-2xl flex items-center gap-2">
            <span class="w-5 h-5 rounded-full border-2 border-slate-900"></span>
            📈 High to Low
          </button>

          <button data-filter="new" class="w-full text-left cartoony-button bg-white hover:bg-amber-50 text-slate-900 font-black px-4 py-3 rounded-2xl flex items-center gap-2">
            <span class="w-5 h-5 rounded-full border-2 border-slate-900"></span>
            ✨ Brand New
          </button>

          <button data-filter="used" class="w-full text-left cartoony-button bg-white hover:bg-amber-50 text-slate-900 font-black px-4 py-3 rounded-2xl flex items-center gap-2">
            <span class="w-5 h-5 rounded-full border-2 border-slate-900"></span>
            ♻️ Used / Pre-Loved
          </button>

          <button data-filter="dupe" class="w-full text-left cartoony-button bg-white hover:bg-amber-50 text-slate-900 font-black px-4 py-3 rounded-2xl flex items-center gap-2">
            <span class="w-5 h-5 rounded-full border-2 border-slate-900"></span>
            🪄 Cheap Alternative
          </button>

          <button data-filter="real" class="w-full text-left cartoony-button bg-white hover:bg-amber-50 text-slate-900 font-black px-4 py-3 rounded-2xl flex items-center gap-2">
            <span class="w-5 h-5 rounded-full border-2 border-slate-900"></span>
            💎 Authentic / Real
          </button>
        </div>
      </aside>

      <!-- Right Column: Results Grid -->
      <section class="md:col-span-3">
        <!-- Loading Spinner -->
        <div id="loading-spinner" class="hidden text-center py-16">
          <div class="inline-block animate-spin text-5xl mb-3">🌀</div>
          <p class="text-xl font-black text-slate-700">Hunting down prices across all store options...</p>
        </div>

        <!-- No Results State -->
        <div id="no-results" class="hidden text-center py-16 bg-white rounded-3xl cartoony-card max-w-md mx-auto">
          <div class="text-5xl mb-3">🛋️</div>
          <h3 class="text-2xl font-black mb-2">No Deals Found</h3>
          <p class="text-slate-600 font-bold px-4">Try searching with simpler terms!</p>
        </div>

        <!-- Product Cards Container -->
        <div id="results-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </section>

    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
